<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
  <section>
    <div class="result">
     <h5>Your Result</h5>
     <div class="circle-container">
       <div class="score">76</div>
       <div class="percent">of 100</div>
     </div>
     <div class="great">
       <h3>Great</h3>
        <p>You scored higher than 65% of the people who have taken these tests.</p>

      </div>

    </div>
    <div class="summary">
      <h4>Summary</h4>
      <div class="reaction">
        <div class="react">
          <img src="assets/images/icon-reaction.svg" />
          <span>Reaction</span>
        </div>
        <span class="score-80">80 <span class="percent">/ 100</span></span>
      </div>
      <div class="memory">
        <div class="memo">
          <img src="assets/images/icon-memory.svg">
          <span>Memory</span>
        </div>
        <span class="score-92">92 <span class="percent">/ 100</span></span>
      </div>
      <div class="verbal">
        <div class="verb">
          <img src="assets/images/icon-verbal.svg">
          <span>Verbal</span>
        </div>
        <span class="score-61">61 <span class="percent">/ 100</span></span>
      </div>
      <div class="visual">
        <div class="vis">
          <img src="assets/images/icon-visual.svg">
          <span>Visual</span>
        </div>
        <span class="score-72">72 <span class="percent">/ 100</span></span>
      </div>
      <div class="continue">Continue</div>

    </div>

  </section>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Ibrahim Abduramon</a>.
  </div>
  
</body>
</html>
